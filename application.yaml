server:
  address: 0.0.0.0

services:
  eureka-server:
    url: ${DISCOVERY_URL:http://localhost:8761/eureka/}
  # keycloak:
  #   url: ${KEYCLOAK_URL:http://127.0.0.1:8180}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${services.eureka-server.url}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
